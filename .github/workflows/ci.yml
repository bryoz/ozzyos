name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Lint (ESLint + jsx-a11y, Stylelint)
        run: pnpm lint
      - name: Build (tokens + WCAG contrast gate, CSS, React, Storybook)
        run: pnpm build
      - run: pnpm typecheck
      - name: Install Chromium for story tests
        run: pnpm --filter @ozzyos/storybook exec playwright install --with-deps chromium
      - name: Test (unit, keyboard, axe on every story)
        run: pnpm test
